[project]
name = "yohan-os"
version = "0.0.0"
description = "Yohan — a personal agent control plane (Phase 0 skeleton)"
requires-python = ">=3.12"
# The root is a workspace container only; it ships no importable code of its own.
dependencies = []

[tool.uv.workspace]
# Every app and package resolves against this single lockfile.
members = ["apps/*", "packages/*"]
# Non-Python members that the globs would otherwise catch:
#   packages/skills — SKILL.md data (loaded at runtime)
#   apps/dashboard  — the Next.js frontend (pnpm, not uv)
exclude = ["packages/skills", "apps/dashboard"]

[tool.uv.sources]
# Internal packages are always taken from the workspace, never PyPI.
yohan-core = { workspace = true }
yohan-agents = { workspace = true }

[dependency-groups]
# Dev tooling shared across the whole workspace: `uv sync` installs these at the root.
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
