[project]
name = "yohan-scheduler"
version = "0.0.0"
description = "Cron-on-bus: publishes scheduled commands onto the bus."
requires-python = ">=3.12"
dependencies = [
    "yohan-core",
    "croniter>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yohan_scheduler"]
