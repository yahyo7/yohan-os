[project]
name = "yohan-gateway"
version = "0.0.0"
description = "FastAPI gateway: Telegram webhook, dispatcher, results relay."
requires-python = ">=3.12"
dependencies = [
    "yohan-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",              # async Telegram Bot API calls
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yohan_gateway"]
