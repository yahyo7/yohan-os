[project]
name = "yohan-trace-writer"
version = "0.0.0"
description = "The single subscriber that persists every bus event to Postgres."
requires-python = ">=3.12"
dependencies = [
    "yohan-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yohan_trace_writer"]
