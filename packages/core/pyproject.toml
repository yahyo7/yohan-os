[project]
name = "yohan-core"
version = "0.0.0"
description = "The contract: event schema, bus client, and shared settings for Yohan."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",          # asyncio client lives in redis.asyncio
    "asyncpg>=0.29",       # raw async Postgres for the traces store
    "pyyaml>=6.0",         # MCP registry config
    "mcp>=1.2",            # official MCP client SDK (tool layer)
    "litellm>=1.50",       # the one model-call abstraction (Ollama + Anthropic)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yohan_core"]
