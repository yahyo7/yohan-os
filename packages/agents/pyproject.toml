description = "Worker agents. Phase 0 ships one: echo."
requires-python = ">=3.12"
dependencies = [
    "yohan-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yohan_agents"]
